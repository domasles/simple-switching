[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-switching-cli"
version = "0.1.0"
description = "Browser extension policy installer built for the Simple Switching extension"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Domas Leščinskas", email = "domas.lescinskas@gmail.com" }
]

license = { text = "Apache-2.0" }
keywords = ["chrome", "chromium", "extension", "enterprise-policy", "textual", "cli", "installer"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "textual>=8.2.8",
    "requests>=2.34.2",
    "psutil>=7.2.2",
]

[project.urls]
"Homepage" = "https://github.com/domasles/simple-switching"
"Bug Reports" = "https://github.com/domasles/simple-switching/issues"
"Source" = "https://github.com/domasles/simple-switching"

[project.scripts]
simple-switching = "shells.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "shells*", "config*", "cache*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.crx", "*.xml", "*.css"]
