name: Build Simple Switching Installers

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Executable (${{ matrix.target_os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target_os: [linux, windows, macos]
        include:
          - target_os: linux
            os: ubuntu-latest
            binary_name: ssi-cli-linux
          - target_os: windows
            os: windows-latest
            binary_name: ssi-cli-windows.exe
          - target_os: macos
            os: macos-latest
            binary_name: ssi-cli-macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        working-directory: installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Compile Standalone Binary
        working-directory: installer
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SEP=";"
          else
            SEP=":"
          fi

          python -m PyInstaller --onefile \
            --paths . \
            --name="${{ matrix.binary_name }}" \
            --add-data "config${SEP}config" \
            --add-data "shells/cli/assets${SEP}assets" \
            shells/cli/app.py

      # Upload as artifact when running locally via act
      - name: Upload Binary Artifact (Local Builds Only)
        if: ${{ env.ACT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: installer/dist/${{ matrix.binary_name }}
          if-no-files-found: error

      # Attach binary to GitHub Release during live releases
      - name: Upload Executable to GitHub Release
        if: ${{ env.ACT != 'true' && github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/${{ matrix.binary_name }}
